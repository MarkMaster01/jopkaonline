<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOP Dispečer - Mílník 1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        canvas {
            background-color: #05070a;
            border: 2px solid #30363d;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        .controls-info {
            font-size: 14px;
            color: #8b949e;
        }
        .controls-info span {
            color: #58a6ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h2>JOP Pult — Testovací Kolejiště</h2>
        <canvas id="jopCanvas" width="900" height="400"></canvas>
        <div class="controls-info">
            Ovládání: <span>Klik na výhybku (W1)</span> = Přehodit směrování | <span>Klik na úsek</span> = Simulovat obsazení/uvolnění vlakem
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
